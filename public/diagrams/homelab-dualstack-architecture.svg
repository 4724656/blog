<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--svg-grid)" stroke-width="0.5"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    :root {
      --svg-bg: #0f172a;
      --svg-surface: #1e293b;
      --svg-grid: #1e293b;
      --svg-text: #ffffff;
      --svg-muted: #94a3b8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --svg-bg: #f8fafc;
        --svg-surface: #ffffff;
        --svg-grid: #e2e8f0;
        --svg-text: #0f172a;
        --svg-muted: #475569;
      }
    }
    text {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>

  <!-- 1. Background Fill & Grid -->
  <rect width="100%" height="100%" fill="var(--svg-bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. Region Boundaries -->
  <!-- Main Router Boundary -->
  <rect x="230" y="80" width="220" height="520" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="245" y="70" width="190" height="22" rx="4" fill="var(--svg-bg)"/>
  <text x="340" y="86" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">主路由 (OpenWrt 192.168.2.1)</text>

  <!-- PVE Host Boundary -->
  <rect x="480" y="80" width="340" height="520" rx="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="495" y="70" width="230" height="22" rx="4" fill="var(--svg-bg)"/>
  <text x="610" y="86" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">PVE 物理机 (192.168.2.55 / 16GB)</text>

  <!-- 3. WAN Client (Left) -->
  <rect x="30" y="160" width="160" height="110" rx="8" fill="var(--svg-bg)"/>
  <rect x="30" y="160" width="160" height="110" rx="8" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="195" fill="var(--svg-text)" font-size="13" font-weight="600" text-anchor="middle">外网移动端</text>
  <text x="110" y="220" fill="#22d3ee" font-size="10" text-anchor="middle">手机 5G / 漫游网络</text>
  <text x="110" y="240" fill="var(--svg-muted)" font-size="9" text-anchor="middle">纯 IPv6 访问 / WireGuard</text>

  <!-- Cloudflare DDNS Target (Bottom Left) -->
  <rect x="30" y="460" width="160" height="90" rx="8" fill="var(--svg-bg)"/>
  <rect x="30" y="460" width="160" height="90" rx="8" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1.5"/>
  <text x="110" y="495" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">Cloudflare DNS</text>
  <text x="110" y="518" fill="#f97316" font-size="10" text-anchor="middle">AAAA 记录同步</text>
  <text x="110" y="534" fill="var(--svg-muted)" font-size="9" text-anchor="middle">*.myhome.xyz</text>

  <!-- 4. Inside Main Router -->
  <!-- FW Rule Box -->
  <rect x="250" y="160" width="180" height="130" rx="8" fill="var(--svg-bg)"/>
  <rect x="250" y="160" width="180" height="130" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">防火墙 (fw4 / nftables)</text>
  <text x="340" y="212" fill="#fbbf24" font-size="10" text-anchor="middle">纯三层路由放行 (FORWARD)</text>
  <text x="340" y="232" fill="var(--svg-muted)" font-size="9" text-anchor="middle">后缀掩码 ::suffix/::ffff...</text>
  <text x="340" y="250" fill="#ef4444" font-size="9" text-anchor="middle">彻底关停 IPv4 端口映射</text>
  <text x="340" y="268" fill="#34d399" font-size="9" text-anchor="middle">放行 TCP 5443 / UDP 35265</text>

  <!-- DDNS Scripts Probe Box -->
  <rect x="250" y="440" width="180" height="120" rx="8" fill="var(--svg-bg)"/>
  <rect x="250" y="440" width="180" height="120" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="470" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">原生 ddns-scripts</text>
  <text x="340" y="492" fill="#38bdf8" font-size="10" text-anchor="middle">/etc/get_docker_ipv6.sh</text>
  <text x="340" y="512" fill="var(--svg-muted)" font-size="9" text-anchor="middle">读主路由 NDP 邻居表抓 IP</text>
  <text x="340" y="530" fill="var(--svg-muted)" font-size="9" text-anchor="middle">精准获取 Docker VM IPv6</text>

  <!-- 5. Inside PVE Host -->
  <!-- Docker VM Box -->
  <rect x="500" y="120" width="300" height="300" rx="10" fill="var(--svg-bg)"/>
  <rect x="500" y="120" width="300" height="300" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="650" y="145" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">Docker 虚拟机 (VM 100 / 8GB)</text>
  
  <!-- Sub-box: docker-proxy -->
  <rect x="520" y="165" width="260" height="50" rx="6" fill="var(--svg-surface)" stroke="#64748b" stroke-width="1"/>
  <text x="650" y="186" fill="var(--svg-text)" font-size="10" font-weight="600" text-anchor="middle">docker-proxy 监听 [::]:5443</text>
  <text x="650" y="202" fill="#34d399" font-size="9" text-anchor="middle">IPv6 接客 ➔ 转发到私网 IPv4 (172.18.0.8:443)</text>

  <!-- Sub-box: Caddy & Containers -->
  <rect x="520" y="230" width="260" height="85" rx="6" fill="var(--svg-surface)" stroke="#64748b" stroke-width="1"/>
  <text x="650" y="250" fill="var(--svg-text)" font-size="10" font-weight="600" text-anchor="middle">Caddy 反代容器 (172.18.0.8)</text>
  <text x="650" y="270" fill="var(--svg-muted)" font-size="9" text-anchor="middle">*.myhome.xyz 自动 HTTPS</text>
  <text x="650" y="288" fill="#38bdf8" font-size="9" text-anchor="middle">业务容器池: 纯内网 IPv4 (172.18.0.x)</text>
  <text x="650" y="302" fill="var(--svg-muted)" font-size="8" text-anchor="middle">Dockge / Dashy / MySQL / cli-proxy-api</text>

  <!-- Sub-box: Local sing-box -->
  <rect x="520" y="330" width="260" height="70" rx="6" fill="var(--svg-surface)" stroke="#a78bfa" stroke-width="1"/>
  <text x="650" y="352" fill="var(--svg-text)" font-size="10" font-weight="600" text-anchor="middle">本机 sing-box (TUN 网关模式)</text>
  <text x="650" y="372" fill="#a78bfa" font-size="9" text-anchor="middle">透明接管容器出海流量 (tun0)</text>
  <text x="650" y="388" fill="var(--svg-muted)" font-size="8" text-anchor="middle">容器留空 proxy-url，宿主机就是网关</text>

  <!-- Gateway VM Box -->
  <rect x="500" y="440" width="300" height="140" rx="10" fill="var(--svg-bg)"/>
  <rect x="500" y="440" width="300" height="140" rx="10" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="1.2"/>
  <text x="650" y="468" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">旁路由网关 (VM 102 / 192.168.2.2)</text>
  <text x="650" y="495" fill="var(--svg-text)" font-size="10" text-anchor="middle">WireGuard 漫游服务 (UDP 35265)</text>
  <text x="650" y="513" fill="#22d3ee" font-size="9" text-anchor="middle">Underlay 纯 IPv6 ➔ Overlay 双栈 (10.10.2.x)</text>
  <text x="650" y="535" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">NAT66 (masq6=1) 源地址伪装</text>
  <text x="650" y="553" fill="var(--svg-muted)" font-size="9" text-anchor="middle">消除局域网非对称回程黑洞</text>

  <!-- 6. Overseas Exit Node (Right) -->
  <rect x="860" y="280" width="170" height="160" rx="8" fill="var(--svg-bg)"/>
  <rect x="860" y="280" width="170" height="160" rx="8" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="945" y="315" fill="var(--svg-text)" font-size="13" font-weight="600" text-anchor="middle">海外 VPS 落地节点</text>
  <text x="945" y="340" fill="#a78bfa" font-size="10" text-anchor="middle">(DMIT 等纯净节点)</text>
  <text x="945" y="365" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">原生纯净海外 IPv6</text>
  <text x="945" y="390" fill="var(--svg-muted)" font-size="9" text-anchor="middle">出口握手 OpenAI / ChatGPT</text>
  <text x="945" y="410" fill="var(--svg-muted)" font-size="8" text-anchor="middle">容器无需关心出口协议</text>

  <!-- 7. Connecting Traffic Lines -->
  <!-- Line 1: Client -> FW (Web) -->
  <line x1="190" y1="200" x2="250" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <!-- Line 2: FW -> docker-proxy -->
  <line x1="430" y1="200" x2="520" y2="190" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <!-- Line 3: Client -> FW -> WireGuard (dashed) -->
  <path d="M 190,230 Q 220,230 250,230" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 430,230 Q 460,230 460,500 L 500,500" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <!-- Line 4: ddns -> cloudflare -->
  <line x1="250" y1="500" x2="190" y2="500" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <!-- Line 5: sing-box -> VPS -->
  <line x1="780" y1="365" x2="860" y2="365" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- 8. Title Header -->
  <text x="30" y="38" fill="var(--svg-text)" font-size="18" font-weight="700">家庭双栈网络与 HomeLab 整体解耦架构</text>
  <text x="30" y="58" fill="#64748b" font-size="11">入站纯 IPv6 路由直通 · 门禁 EUI-64 掩码与探针 · 业务纯 IPv4 解耦 · sing-box 透明出境 · WireGuard NAT66 闭环</text>
</svg>
