<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--svg-grid)" stroke-width="0.5"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    :root {
      --svg-bg: #0f172a;
      --svg-surface: #1e293b;
      --svg-grid: #1e293b;
      --svg-text: #ffffff;
      --svg-muted: #94a3b8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --svg-bg: #f8fafc;
        --svg-surface: #ffffff;
        --svg-grid: #e2e8f0;
        --svg-text: #0f172a;
        --svg-muted: #475569;
      }
    }
    text {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>

  <!-- 1. Background Fill & Grid -->
  <rect width="100%" height="100%" fill="var(--svg-bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. Region Boundaries -->
  <!-- Debian Gateway Host Boundary -->
  <rect x="250" y="70" width="530" height="540" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="265" y="60" width="220" height="22" rx="4" fill="var(--svg-bg)"/>
  <text x="275" y="76" fill="#38bdf8" font-size="12" font-weight="700">Debian 宿主机 (Gateway Host)</text>

  <!-- Remote Client Boundary -->
  <rect x="30" y="160" width="170" height="240" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="40" y="150" width="120" height="20" rx="4" fill="var(--svg-bg)"/>
  <text x="48" y="165" fill="var(--svg-muted)" font-size="11" font-weight="600">接入终端环境</text>

  <!-- External Destination Boundary -->
  <rect x="830" y="110" width="200" height="490" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="845" y="100" width="110" height="20" rx="4" fill="var(--svg-bg)"/>
  <text x="855" y="115" fill="var(--svg-muted)" font-size="11" font-weight="600">网络访问目标</text>

  <!-- 3. Connection Lines & Arrows (Behind components) -->
  <!-- Client to wg0 -->
  <path d="M 170 240 L 290 240" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  
  <!-- wg0 to Linux Kernel / Firewall -->
  <path d="M 400 270 L 400 320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Kernel forwarding split to LAN MASQUERADE -->
  <path d="M 370 410 L 370 460" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Kernel forwarding split to sing-box tun0 -->
  <path d="M 640 410 L 640 460" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- LAN MASQUERADE to NAS Device -->
  <path d="M 480 500 L 850 500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- sing-box to Internet / Proxy -->
  <path d="M 750 500 L 800 500 L 800 240 L 850 240" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- 4. Component Masking & Visual Boxes -->

  <!-- Remote Client Box -->
  <rect x="45" y="205" width="140" height="70" rx="8" fill="var(--svg-bg)"/>
  <rect x="45" y="205" width="140" height="70" rx="8" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="115" y="235" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">远程移动客户端</text>
  <text x="115" y="255" fill="var(--svg-muted)" font-size="10" text-anchor="middle">IP: 10.10.99.3/32</text>

  <!-- Client Note -->
  <text x="115" y="320" fill="#64748b" font-size="9" text-anchor="middle">通过 UDP 端口建立</text>
  <text x="115" y="336" fill="#38bdf8" font-size="9" text-anchor="middle">WireGuard 握手</text>

  <!-- WireGuard Interface wg0 -->
  <rect x="290" y="205" width="220" height="65" rx="8" fill="var(--svg-bg)"/>
  <rect x="290" y="205" width="220" height="65" rx="8" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="233" fill="var(--svg-text)" font-size="13" font-weight="600" text-anchor="middle">WireGuard 接口 (wg0)</text>
  <text x="400" y="253" fill="#38bdf8" font-size="10" text-anchor="middle">10.10.99.1/24 · 解密进站流量</text>

  <!-- Central Processing: Linux Forwarding & DOCKER-USER -->
  <rect x="280" y="320" width="470" height="90" rx="10" fill="var(--svg-bg)"/>
  <rect x="280" y="320" width="470" height="90" rx="10" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  
  <text x="515" y="347" fill="var(--svg-text)" font-size="13" font-weight="700" text-anchor="middle">Linux 内核转发 &amp; 防火墙链校验</text>
  
  <!-- Mini tags inside central box -->
  <rect x="300" y="362" width="205" height="32" rx="6" fill="var(--svg-bg)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="402" y="382" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">net.ipv4.ip_forward = 1</text>

  <rect x="525" y="362" width="205" height="32" rx="6" fill="var(--svg-bg)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="627" y="382" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">DOCKER-USER 双向放行</text>

  <!-- Left Branch: LAN NAT Forwarding -->
  <rect x="280" y="460" width="200" height="80" rx="8" fill="var(--svg-bg)"/>
  <rect x="280" y="460" width="200" height="80" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="380" y="490" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">物理网卡出口 &amp; MASQUERADE</text>
  <text x="380" y="510" fill="#a7f3d0" font-size="10" text-anchor="middle">出接口: &lt;LAN_IF&gt; (192.168.2.99)</text>
  <text x="380" y="526" fill="var(--svg-muted)" font-size="9" text-anchor="middle">源地址伪装，解决局域网回包路由</text>

  <!-- Right Branch: sing-box TUN Proxy -->
  <rect x="550" y="460" width="200" height="80" rx="8" fill="var(--svg-bg)"/>
  <rect x="550" y="460" width="200" height="80" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="650" y="490" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">sing-box 虚拟网卡 (tun0)</text>
  <text x="650" y="510" fill="#ddd6fe" font-size="10" text-anchor="middle">auto_route · 策略路由接管</text>
  <text x="650" y="526" fill="var(--svg-muted)" font-size="9" text-anchor="middle">DNS 拦截 · 公网/外网流量走代理</text>

  <!-- Target 1: Public Internet / Outbound Node -->
  <rect x="850" y="200" width="160" height="80" rx="8" fill="var(--svg-bg)"/>
  <rect x="850" y="200" width="160" height="80" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="930" y="232" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">互联网 / 境外节点</text>
  <text x="930" y="252" fill="#a78bfa" font-size="10" text-anchor="middle">目标: 0.0.0.0/0</text>
  <text x="930" y="268" fill="var(--svg-muted)" font-size="9" text-anchor="middle">走落地 VPS / 节点出口</text>

  <!-- Target 2: Home LAN NAS / Devices -->
  <rect x="850" y="460" width="160" height="80" rx="8" fill="var(--svg-bg)"/>
  <rect x="850" y="460" width="160" height="80" rx="8" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="930" y="492" fill="var(--svg-text)" font-size="12" font-weight="600" text-anchor="middle">家庭局域网设备 (NAS)</text>
  <text x="930" y="512" fill="#34d399" font-size="10" text-anchor="middle">IP: 192.168.2.20</text>
  <text x="930" y="528" fill="var(--svg-muted)" font-size="9" text-anchor="middle">同二层直达，原路响应回包</text>

  <!-- 5. Dynamic Traffic Path Labels on Lines -->
  <rect x="185" y="228" width="85" height="18" rx="4" fill="var(--svg-bg)" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="227" y="241" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">WireGuard 隧道</text>

  <rect x="330" y="425" width="85" height="18" rx="4" fill="var(--svg-bg)" stroke="#34d399" stroke-width="0.8"/>
  <text x="372" y="438" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">私网/局域网流量</text>

  <rect x="600" y="425" width="85" height="18" rx="4" fill="var(--svg-bg)" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="642" y="438" fill="#a78bfa" font-size="8" font-weight="600" text-anchor="middle">外网/代理流量</text>

  <rect x="520" y="492" width="125" height="18" rx="4" fill="var(--svg-bg)" stroke="#34d399" stroke-width="0.8"/>
  <text x="582" y="505" fill="#34d399" font-size="8" font-weight="500" text-anchor="middle">源IP变为 192.168.2.99</text>

  <!-- 6. Title Block -->
  <text x="30" y="38" fill="var(--svg-text)" font-size="18" font-weight="700">Debian 宿主机网络转发与双分流拓扑</text>
  <text x="30" y="58" fill="#64748b" font-size="11">WireGuard 远程接入 + Linux 内核转发/防火墙 + sing-box TUN 分流与局域网 NAT 机制</text>

  <!-- 7. Legend -->
  <g transform="translate(30, 625)">
    <rect x="0" y="-12" width="10" height="10" rx="2" fill="#22d3ee"/>
    <text x="16" y="-3" fill="var(--svg-muted)" font-size="10">客户端接入</text>

    <rect x="110" y="-12" width="10" height="10" rx="2" fill="#fb7185"/>
    <text x="126" y="-3" fill="var(--svg-muted)" font-size="10">防火墙 / DOCKER-USER</text>

    <rect x="270" y="-12" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="286" y="-3" fill="var(--svg-muted)" font-size="10">局域网与 NAT 伪装</text>

    <rect x="420" y="-12" width="10" height="10" rx="2" fill="#a78bfa"/>
    <text x="436" y="-3" fill="var(--svg-muted)" font-size="10">sing-box 代理与分流</text>
  </g>
</svg>
